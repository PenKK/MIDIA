[project]
name = "midia-backend"
version = "0.1.0"
description = "Midia backend for auth and cloud syncing"
requires-python = ">=3.11"
dependencies = [
    "pyjwt>=2.12.1",
    "pwdlib[argon2]>=0.3.0",
    "pydantic-settings>=2.13.1",
    "fastapi[standard]>=0.135.1",
    "uvicorn>=0.42.0",
    "sqlalchemy>=2.0.48",
    "mangum>=0.21.0",
]

[dependency-groups]
dev = [
    "pre-commit>=4.0.0",
    "ruff>=0.11.0",
    "mypy>=1.15.0",
    "pytest>=8.0.0",
    "pytest-cov>=6.0.0",
    "httpx>=0.28.0",
]